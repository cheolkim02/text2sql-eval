[project]
name = "text2sql-eval"
version = "0.1.0"
description = "Deterministic, evidence-backed error analysis and run comparison for text-to-SQL experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cheolkim02" }]
requires-python = ">=3.11"
keywords = ["text-to-sql", "nl2sql", "evaluation", "error-analysis", "bird"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/cheolkim02/text2sql-eval"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
