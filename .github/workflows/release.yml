name: Release

# ADR 0046: pushing a v* tag builds the package, checks it, and publishes it
# to PyPI with Trusted Publishing (OIDC). No API token is stored anywhere.
# The PyPI pending publisher expects exactly this file name (release.yml)
# and the environment name "pypi".
on:
  push:
    tags: ["v*"]

env:
  # Keep in sync with ci.yml and the uv_build bound in pyproject.toml (ADR 0010).
  UV_VERSION: "0.13.7"

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      # Actions are pinned to full commit SHAs; the comment shows the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: uv build
      # Installs the dependencies from PyPI and runs them, so it runs here,
      # in a job that cannot get a PyPI token.
      - name: Install the wheel in a clean environment and run the CLI
        run: sh scripts/smoke_wheel.sh
      - name: Record the hash of the checked files
        id: hash
        run: echo "sha256=$(sha256sum dist/* | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/text2sql-eval/
    permissions:
      contents: read
      id-token: write # lets PyPI verify this workflow (Trusted Publishing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # uv_build writes reproducible archives, so rebuilding the same commit
      # gives the files the check job tested; the hash comparison proves it.
      - run: uv build
      - name: Check that these are the files the check job tested
        env:
          EXPECTED: ${{ needs.check.outputs.sha256 }}
        run: |
          actual="$(sha256sum dist/* | sha256sum | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "rebuilt files differ from the checked ones" >&2
            exit 1
          fi
      # With id-token permission, uv publish uses Trusted Publishing by itself.
      - run: uv publish
