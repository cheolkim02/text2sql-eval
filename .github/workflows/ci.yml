name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the uv_build bound in pyproject.toml (ADR 0010).
  UV_VERSION: "0.13.7"

jobs:
  lint:
    name: Lint, format, type check
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; the comment shows the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # The examples group (openai) lets pyright check examples/baseline (ADR 0029).
      - run: uv sync --locked --group examples
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --group examples pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ADR 0009: from the lowest supported version to the newest release.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build
      - name: Check that the wheel ships the type marker, template and license
        run: |
          unzip -l dist/*.whl | tee wheel-contents.txt
          grep -q "text2sql_eval/py.typed" wheel-contents.txt
          grep -q "text2sql_eval/report/templates/report.html.j2" wheel-contents.txt
          grep -q "licenses/LICENSE" wheel-contents.txt
      # ADR 0044: the built wheel alone, without dev dependencies, must run the
      # CLI end to end. The release workflow runs the same script (ADR 0046).
      - name: Install the wheel in a clean environment and run the CLI
        run: sh scripts/smoke_wheel.sh
